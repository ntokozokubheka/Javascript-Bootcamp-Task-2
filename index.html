<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Grading System</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <div id="form-card" class="card">
        <h2>Student Grade Portal</h2>
        <form id="grade-form">
          <div class="form-group">
            <label for="student-name">Student Name:</label>
            <input
              type="text"
              id="student-name"
              placeholder="Enter full name"
              required
            />
          </div>

          <div class="form-group">
            <label for="student-mark">Mark [0–100]:</label>
            <input
              type="number"
              id="student-mark"
              min="0"
              max="100"
              placeholder="Enter mark"
              required
            />
          </div>

          <button type="submit" id="submit-btn">Submit Grade</button>
        </form>
        <p id="error-msg" class="error"></p>
      </div>

      <div id="thank-you-card" class="card hidden">
        <h2>Thank You!</h2>
        <p>The student's data has been successfully processed.</p>

        <div id="result-box"></div>

        <button id="reset-btn">Add Another Student</button>
      </div>

      <div class="history-section">
        <h3>Submitted Students Log</h3>
        <ul id="student-list"></ul>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
